name: Publish dashboard (manual opt-in)

# Never deploy on push: repository preparation must not activate monitoring.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate public dashboard configuration
        env:
          MONITORING_DATA_URL: ${{ vars.MONITORING_DATA_URL }}
          MONITORING_TITLE: ${{ vars.MONITORING_TITLE }}
        run: python3 deploy/render_config.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # Only static public files: never upload .env, Python, or local state.
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
